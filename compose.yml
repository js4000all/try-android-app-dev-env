services:
  dev:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    init: true
    volumes:
      - .:/workspace:cached
      - /srv/volumes/try-android-app-dev-env/gradle-cache:/home/vscode/.gradle
      - /srv/volumes/try-android-app-dev-env/android-user-data:/home/vscode/.android
    working_dir: /workspace
    command: sleep infinity
